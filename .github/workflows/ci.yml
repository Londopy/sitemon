name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what ASL3 (Debian 12) and Raspberry Pi OS bookworm ship, so it
        # is the version that matters most; newer ones catch deprecations early.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # No [pi] extra: CI has no I2C bus or GPIO, and the tests use the
      # simulated backends anyway.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy sitemon
      - run: pytest
