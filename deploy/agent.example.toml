# hubs = ["https://sitemon.example.org"]   # https, wireline only (Part 97): never a mesh-only hub
# operators = ["OPERATOR-PUBLIC-KEY"]      # from `sitemon keygen` on each operator's computer
# hub_keys = ["HUB-PUBLIC-KEY"]            # lets that hub ask for spoken alerts, nothing else
# watchdog_pin = 22                        # keep-alive for the relay cutoff circuit

