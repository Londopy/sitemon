# People who may send relay commands (`sitemon command`), and to which sites.
# [[operators]]
# name = "trustee"
# key = "OPERATOR-PUBLIC-KEY"
# sites = ["*"]

# Only does anything if the agent has registration_command set (see agent.example.toml).
[[rules]]
name = "Node not registered with AllStarLink"
type = "state"
metric = "ami.registered"
bad = false

[[rules]]
name = "AREDN node unreachable"
type = "state"
metric = "aredn.reachable"
bad = false

# Alert channels
# Secrets come from the environment (*_env) or a file (*_file), never this file.

[[channels]]
type = "discord"
name = "discord"
url_env = "SITEMON_DISCORD_WEBHOOK"
min_severity = "warn"
groups = ["*"]

[[channels]]
type = "ntfy"
name = "trustee-phones"
server = "https://ntfy.sh"
topic = "sitemon-change-me"    # pick something unguessable, or self-host ntfy with a token
# token_env = "SITEMON_NTFY_TOKEN"
min_severity = "critical"

