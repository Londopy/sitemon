# sitemon hub config: /etc/sitemon/hub.toml
# Check it with:  sitemon check /etc/sitemon/hub.toml
# Durations: 30s, 5m, 2h, 7d.

[hub]
listen = "0.0.0.0:8470"
db = "/var/lib/sitemon/hub.db"
public_url = "https://sitemon.example.org"   # used for links in alerts; "" to leave them out
group = "sites"                               # default group for sites that don't name one
remind_critical = "12h"                       # repeat a critical alert this often while it lasts
retention = "400d"                            # keep a year of history plus a margin
# key = "/etc/sitemon/hub.key"                # signs spoken alerts; needed for announce = true
# announce_gap = "10m"                        # at most one spoken alert per site this often

# Each group gets its own dashboard page and weekly summary.
[groups]
sites = "Repeater sites"
# hills = "Hilltop sites"

# Sites
# key = the line `sitemon keygen` printed on the site. During a key change, list both:
# keys = ["<old>", "<new>"]

[[sites]]
id = "hilltop"
name = "Hilltop repeater"
key = "REPLACE-WITH-SITE-PUBLIC-KEY-FROM-KEYGEN======"

# [[sites]]
# id = "north-ridge"
# name = "North Ridge"
# group = "hills"
# key = "..."

# Silence
# A dead site can't report itself. The hub raises this from its own clock.
[heartbeat]
warn_after = "5m"
critical_after = "15m"

# Rules
# metric = "<sensor name>.<value>", e.g. batt.v, env.temp_c, door.open, ami.registered.
# sites = ["*"] by default; patterns like ["mtn-*"] work.

[[rules]]
name = "Battery low"
metric = "batt.v"
below = 12.2
critical_below = 11.8
hysteresis = 0.1
hold = "2m"          # must stay low this long: a transmitter key-up sag doesn't count
unit = "V"

[[rules]]
name = "Battery falling"
type = "rate"
metric = "batt.v"
window = "7d"
smooth = "1d"        # daily averages, so the solar charge cycle doesn't look like a trend
drop = 0.3
critical_drop = 0.6
unit = "V"

[[rules]]
name = "Site too hot"
metric = "env.temp_c"
above = 40
critical_above = 50
hysteresis = 2
unit = "°C"

[[rules]]
name = "Door open"
type = "state"
metric = "door.open"
bad = true
escalate_after = "30m"   # nobody's on a workday after half an hour: critical

[[rules]]
name = "Water on the floor"
type = "state"
metric = "water.present"
bad = true
severity = "critical"
# announce = true    # say it on the repeater too (deploy/README.md section 9)

