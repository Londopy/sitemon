# The hub's internet mirror, behind Anubis. Anubis makes browsers solve a tiny
# proof-of-work before they reach the dashboard, which keeps AI scrapers and
# bulk crawlers off it. Your reverse proxy (Caddy/nginx) forwards to
# 127.0.0.1:8923, not to the hub. Site agents are let straight through to
# /api/ingest by anubis-botPolicy.yaml; their uploads are signed anyway.
#
# Set listen = "0.0.0.0:8470" and db = "/var/lib/sitemon/hub.db" in hub.toml.
services:
  anubis:
    # pinned so an upstream release can't change behavior under us; bump on purpose
    image: ghcr.io/techarohq/anubis:v1.28.2
    restart: unless-stopped
    env_file: .env # ED25519_PRIVATE_KEY_HEX lives here, untracked (see .env.example)
    environment:
      BIND: ":8923"
      TARGET: "http://hub:8470"
      DIFFICULTY: "4"
      # one pass works for every subdomain; no port here
      COOKIE_DOMAIN: "example.org"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
      # robots.txt and link previews (Discord) keep working
      SERVE_ROBOTS_TXT: "true"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
      # internal only, never published
      METRICS_BIND: ":9090"
    volumes:
      - "./anubis-botPolicy.yaml:/data/cfg/botPolicy.yaml:ro"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    ports:
      # only the reverse proxy should reach this
      - "127.0.0.1:8923:8923"

  hub:
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile
    restart: unless-stopped
    env_file: hub.env # SITEMON_DISCORD_WEBHOOK etc., untracked (see hub.env.example)
    environment:
      # the weekly summary goes out at [summary] hour in this zone
      TZ: "America/Los_Angeles"
    volumes:
      - "./hub.toml:/etc/sitemon/hub.toml:ro"
      - "hub-data:/var/lib/sitemon"
    # no published ports: the hub is reachable only through anubis

volumes:
  hub-data:
